<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Tiệm Trà Sữa Nhỏ - Game Mở Quán Trà Sữa Online</title>
  <meta name="description" content="Chơi miễn phí trên trình duyệt: Mở tiệm trà sữa, pha chế đúng vị đường đá, thêm trân châu pudding, chiều khách khó tính và nâng cấp tiệm mỗi ngày!">
  <meta name="theme-color" content="#794D31">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Paytone+One&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Global Audio Context & SVG Icon Defs -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gCup" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
        <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.3"/>
        <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      </linearGradient>
      <linearGradient id="gBlackTea" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#9C441E"/>
        <stop offset="100%" stop-color="#732B0F"/>
      </linearGradient>
      <linearGradient id="gMilkTea" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#DDB38A"/>
        <stop offset="100%" stop-color="#C5966B"/>
      </linearGradient>
      <linearGradient id="gOolong" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#CCA175"/>
        <stop offset="100%" stop-color="#AD7E51"/>
      </linearGradient>
      <linearGradient id="gGreenTea" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#EAD68C"/>
        <stop offset="100%" stop-color="#C2AD61"/>
      </linearGradient>
      <linearGradient id="gMatcha" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#8DB658"/>
        <stop offset="100%" stop-color="#678E34"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="app">
    <!-- Top Bar: Status, Ngày, Doanh thu, Sao uy tín, Nút âm thanh -->
    <header id="top">
      <div class="top-left">
        <div class="day-badge" id="topDay">Ngày 1</div>
        <div class="shop-name-mini" id="topShopName">Tiệm Trà Sữa Nhỏ</div>
      </div>
      <div class="top-center">
        <div class="money-box">
          <small>Ngân quỹ</small>
          <span id="topMoney">150.000đ</span>
        </div>
      </div>
      <div class="top-right">
        <div class="reputation-box">
          <span class="stars" id="topStars">⭐⭐⭐⭐⭐</span>
          <span class="score" id="topRating">5.0</span>
        </div>
        <button id="btnSound" class="icon-btn" title="Bật/Tắt âm thanh" aria-label="Âm thanh">🔊</button>
      </div>
    </header>

    <!-- Main View Container: Dynamic giữa Màn Chuẩn Bị & Màn Bán Hàng -->
    <main id="view">
      <!-- Nội dung được kết xuất tự động từ Game Engine JS -->
    </main>

    <!-- Modal Box: Báo cáo ngày, thông báo, nâng cấp, sự cố -->
    <div id="modal" hidden>
      <div id="modalOverlay"></div>
      <div id="modalCard" role="dialog" aria-modal="true">
        <!-- Render nội dung modal qua JS -->
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Hiệu ứng hạt rơi, tiền xu, tim bay -->
    <div id="fxLayer" class="fx-layer" pointer-events="none"></div>
  </div>

  <script src="assets/js/game.js"></script>
</body>
</html>
