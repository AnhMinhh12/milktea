<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>🧋 Tiệm Trà Sữa Của Rùa - Game Quản Lý & Pha Chế Trà Sữa</title>
  <meta name="description" content="Game mobile 2D casual mô phỏng quản lý tiệm trà sữa của Rùa. Pha chế nhanh, tự động dập nắp, thuê nhân viên và nâng cấp tiệm mỗi ngày!">
  <meta name="theme-color" content="#5C3826">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&family=Paytone+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261007_01">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Global Audio Context & SVG Icon Defs -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gCup" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
        <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.35"/>
        <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="app">
    <!-- Top Bar: Nút tạm dừng ⏸, Ngày + Đồng hồ giờ, Ngân quỹ 💰, Đánh giá ⭐ -->
    <header id="top">
      <div class="top-left">
        <button id="btnPause" class="top-icon-btn" title="Tạm dừng game" aria-label="Tạm dừng">⏸</button>
        <button id="btnSound" class="top-icon-btn" title="Bật/Tắt âm thanh" aria-label="Âm thanh">🔊</button>
      </div>

      <div class="top-center">
        <div class="top-day-title" id="topDay">NGÀY 1</div>
        <div class="top-day-clock" id="topClock">09:00</div>
      </div>

      <div class="top-right">
        <div class="top-money-badge">
          <span class="coin-icon">💰</span>
          <span id="topMoney">150K</span>
        </div>
        <div class="top-rating-badge">
          <span id="topStars">⭐⭐⭐⭐⭐</span>
          <b id="topRating">5.0</b>
        </div>
      </div>
    </header>

    <!-- Biển hiệu tiệm dễ thương -->
    <div class="brand-strip">
      <span class="turtle-icon">🐢</span>
      <span class="brand-title">TIỆM TRÀ SỮA CỦA RÙA</span>
      <span class="turtle-icon">🧋</span>
    </div>

    <!-- Main View Container: Giao diện Chuẩn bị hoặc Bán hàng -->
    <main id="view">
      <!-- Kết xuất giao diện qua JS -->
    </main>

    <!-- Modal Box: Hộp thoại xác nhận, Tạm dừng, Báo cáo, Nhân viên -->
    <div id="modal" hidden>
      <div id="modalOverlay"></div>
      <div id="modalCard" role="dialog" aria-modal="true">
        <!-- Render nội dung modal qua JS -->
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Hiệu ứng hạt rơi, tiền xu, tim bay -->
    <div id="fxLayer" class="fx-layer" pointer-events="none"></div>
  </div>

  <script src="assets/js/game.js?v=20261007_01"></script>
</body>
</html>
